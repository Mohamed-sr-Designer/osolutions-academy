<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My learning — Osolutions Academy</title>
<meta name="description" content="Your courses, progress, live sessions, assignments, badges and certificates.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="OSO Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="assets/css/fixes.css">
</head>
<body>

<header data-app-header></header>

<main class="shell shell--wide app">
  <h1 class="sr-only" data-page-h1></h1>

  <aside class="side">
    <div class="card card--pad" style="padding:1.1rem">
      <div class="side__who" data-who></div>
      <nav class="side__nav" data-nav style="margin-top:1rem"></nav>
    </div>
    <div class="card card--pad" data-side-cta style="display:flex;flex-direction:column;gap:.75rem"></div>
  </aside>

  <div>
    <!-- OVERVIEW -->
    <section class="pane is-on" data-pane="overview">
      <div class="pane__head">
        <div>
          <h2 data-ov-hi></h2>
          <p data-i18n="dash.sub"></p>
        </div>
      </div>
      <div class="kpis" data-ov-kpis></div>
      <h3 style="font-size:1.02rem;margin-bottom:.8rem" data-i18n="dash.continue"></h3>
      <div data-ov-continue style="margin-bottom:1.5rem"></div>
      <div class="cols">
        <div class="card panel">
          <div class="panel__head">
            <h3 data-i18n="dash.activity"></h3>
            <span class="mono" data-i18n="dash.last12"></span>
          </div>
          <div class="spark" data-ov-spark></div>
          <div class="spark-x" data-ov-sparkx></div>
        </div>
        <div class="card panel">
          <div class="panel__head"><h3 data-i18n="dash.weekGoal"></h3></div>
          <div class="goal" data-ov-goal></div>
        </div>
      </div>
      <div class="cols" style="margin-top:1rem">
        <div class="card panel">
          <div class="panel__head"><h3 data-i18n="dash.upcoming"></h3></div>
          <div data-ov-sessions></div>
        </div>
        <div class="card panel">
          <div class="panel__head">
            <h3 data-i18n="dash.assignments"></h3>
            <button class="btn btn--quiet btn--sm" data-goto="assignments" data-i18n="g.viewAll"></button>
          </div>
          <div data-ov-due></div>
        </div>
      </div>
    </section>

    <!-- COURSES -->
    <section class="pane" data-pane="courses">
      <div class="pane__head"><h2 data-i18n="dash.myCourses"></h2></div>
      <div class="grid grid--3" data-my-courses></div>
    </section>

    <!-- SCHEDULE -->
    <section class="pane" data-pane="schedule">
      <div class="pane__head"><h2 data-i18n="dash.schedule"></h2></div>
      <div class="card panel" data-schedule></div>
    </section>

    <!-- ASSIGNMENTS -->
    <section class="pane" data-pane="assignments">
      <div class="pane__head"><h2 data-i18n="dash.assignments"></h2></div>
      <div class="card panel" data-assignments></div>
    </section>

    <!-- BADGES -->
    <section class="pane" data-pane="badges">
      <div class="pane__head">
        <div>
          <h2 data-i18n="dash.badgeH"></h2>
          <p data-i18n="dash.badgeP"></p>
        </div>
      </div>
      <div class="bgrid" data-badges></div>
    </section>

    <!-- CERTIFICATES -->
    <section class="pane" data-pane="certs">
      <div class="pane__head"><h2 data-i18n="dash.certH"></h2></div>
      <div data-certs style="display:grid;gap:1rem"></div>
    </section>
  </div>

</main>

<footer data-app-footer></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/seo.js"></script>
<script src="assets/js/cro.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
