<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All courses — Osolutions Academy</title>
<meta name="description" content="Eight programmes across social design, motion, brand identity, AI workflows, performance creative, art direction, vector craft and concept.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="OSO Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="assets/css/fixes.css">
</head>
<body>

<header data-app-header></header>

<main>
  <section class="page-head">
    <div class="shell shell--wide">
      <nav class="crumbs">
        <a href="index.html" data-i18n="nav.home"></a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        <span data-i18n="nav.courses"></span>
      </nav>
      <h1 style="font-size:clamp(2rem,4.4vw,3.2rem)" data-i18n="cat.title"></h1>
      <p class="lede" style="margin-top:.9rem" data-i18n="cat.sub"></p>
    </div>
  </section>

  <div class="filters">
    <div class="shell shell--wide">
      <div class="filters__in">
        <label class="filters__search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="input" type="search" data-search data-i18n-ph="cat.search">
        </label>
        <div class="filters__row">
          <select class="select" data-level></select>
          <select class="select" data-ses></select>
          <select class="select" data-sort></select>
          <span class="filters__count" data-count-out></span>
        </div>
      </div>
      <div class="chips-scroll" style="margin-top:.7rem" data-cats></div>
    </div>
  </div>

  <section style="padding-bottom:clamp(3.5rem,7vw,6rem)">
    <div class="shell shell--wide">
      <div class="grid grid--3" data-results></div>
      <div class="empty" data-empty hidden>
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <h3 data-i18n="cat.none"></h3>
        <button class="btn btn--ghost btn--sm" style="margin-top:1.1rem" data-reset data-i18n="cat.reset"></button>
      </div>
    </div>
  </section>
</main>

<footer data-app-footer></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/seo.js"></script>
<script src="assets/js/cro.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/catalog.js"></script>
</body>
</html>
