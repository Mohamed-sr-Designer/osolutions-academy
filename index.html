<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osolutions Academy — Creative education built inside a working agency</title>
<meta name="description" content="Courses in social design systems, motion, brand identity, AI workflows and performance creative. Built and taught by the Osolutions team in Cairo.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="OSO Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="assets/css/home.css">
<link rel="stylesheet" href="assets/css/fixes.css">
</head>
<body>

<header data-app-header></header>

<main>

  <!-- 1 · HERO -->
  <section class="hero2">
    <div class="hero2__bg"><div class="hero2__glow"></div><div class="hero2__grid"></div></div>
    <div class="shell shell--wide hero2__in">
      <div>
        <span class="pill pill--on-dark" data-h-pill></span>
        <h1 data-h-title data-split></h1>
        <p class="hero2__sub" data-h-sub></p>
        <div class="hero2__row">
          <a class="cta-round" href="courses.html" data-h-cta data-magnet="0.16"></a>
          <div class="hero2__rev" data-h-rev></div>
        </div>
      </div>
      <div class="hero2__art" data-tilt="6">
        <img class="hero2__hand" src="assets/img/scenes/hero-hand.webp" alt="" width="1100" height="1100" fetchpriority="high">
        <img class="hero2__chip" src="assets/img/mark-white.svg" alt="" width="78" height="78">
      </div>
    </div>
    <a class="hero2__scroll" href="#impact" aria-label="Scroll to content">
      <span data-h-scroll></span><i></i>
    </a>
  </section>

  <!-- logo strip -->
  <div class="lstrip" style="background:#0A1729">
    <div class="lstrip__track" data-h-logos></div>
  </div>

  <!-- 2 · IMMEDIATE IMPACT + SHOWCASE -->
  <section class="section" id="impact">
    <div class="shell shell--wide">
      <div class="head-c rv">
        <span class="pill" data-h-impactPill></span>
        <h2 data-h-impactH data-split></h2>
        <p data-h-impactP></p>
      </div>
      <div class="showcase rv rv-d1">
        <img src="assets/img/scenes/night-studio.webp" alt="The Osolutions studio at night" loading="lazy">
        <div class="showcase__veil"></div>
        <div class="showcase__in" data-h-showcase></div>
      </div>
    </div>
  </section>

  <!-- 3 · WHY TRUST -->
  <section class="section section--tint">
    <div class="shell shell--wide trust2">
      <div class="rv">
        <span class="pill pill--orange" data-h-trustPill></span>
        <h2 style="margin-top:1.1rem" data-h-trustH data-split></h2>
      </div>
      <div class="rv rv-d1">
        <div data-h-trustBody></div>
        <a class="cta-round" href="courses.html" style="margin-top:1.75rem" data-h-trustCta></a>
      </div>
    </div>
  </section>

  <!-- 3b · HOW A COHORT RUNS (scroll linked) -->
  <section class="section" data-story>
    <div class="shell shell--wide">
      <div class="head-c rv">
        <span class="pill pill--orange" data-h-howPill></span>
        <h2 data-h-howH data-split></h2>
        <p data-h-howP></p>
      </div>
      <div class="story__track">
        <div class="story__pin">
          <div class="story__vis">
            <img class="is-on" src="assets/img/scenes/studio.webp" alt="" loading="lazy">
            <img src="assets/img/scenes/live-session.webp" alt="" loading="lazy">
            <img src="assets/img/scenes/critique.webp" alt="" loading="lazy">
            <img src="assets/img/scenes/mentoring.webp" alt="" loading="lazy">
            <span class="story__num" data-story-num></span>
          </div>
        </div>
        <div class="story__steps" data-h-how></div>
      </div>
    </div>
  </section>

  <!-- 4 · BY THE NUMBERS + 5 · COURSES + 6 · DIFFERENT (one dark region) -->
  <div class="dark-sec">
    <section class="section">
      <div class="shell shell--wide">
        <div class="head-c rv">
          <span class="pill pill--on-dark" data-h-numPill></span>
          <h2 data-h-numH data-split></h2>
        </div>
        <div class="nums rv" data-h-nums data-stagger></div>
        <p class="nums-note rv rv-d2" data-h-numNote></p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="shell shell--wide">
        <div class="head-c rv">
          <span class="pill pill--on-dark" data-h-crsPill></span>
          <h2 data-h-crsH data-split></h2>
          <p data-h-crsP></p>
        </div>
        <div class="grid grid--4" data-h-courses data-stagger></div>
        <div style="display:flex;justify-content:center;margin-top:clamp(2rem,4vw,3rem)">
          <a class="cta-round cta-round--on-dark" href="courses.html" data-h-crsAll></a>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="shell shell--wide">
        <div class="head-c rv">
          <span class="pill pill--on-dark" data-h-diffPill></span>
          <h2 data-h-diffH data-split></h2>
          <p data-h-diffP></p>
        </div>
        <div class="diff" data-h-diff data-stagger></div>
        <div style="display:flex;justify-content:center;margin-top:clamp(2rem,4vw,3rem)">
          <a class="cta-round" href="courses.html" data-h-diffCta></a>
        </div>
      </div>
    </section>
  </div>

  <!-- 7 · GRADUATES -->
  <section class="section">
    <div class="shell shell--wide">
      <div class="head-c rv">
        <span class="pill pill--orange" data-h-gradPill></span>
        <h2 data-h-gradH data-split></h2>
        <p data-h-gradP></p>
      </div>
      <div class="grads" data-h-grads data-stagger></div>
      <p style="text-align:center;font-size:.76rem;color:var(--text-3);margin-top:1.75rem;max-width:62ch;margin-inline:auto;line-height:1.55" data-h-gradNote></p>
    </div>
  </section>

  <!-- 8 · SUCCESS STORIES -->
  <section class="section section--tint">
    <div class="shell shell--wide">
      <div class="head-c rv">
        <span class="pill" data-h-revPill></span>
        <h2 data-h-revH data-split></h2>
        <p data-h-revP></p>
      </div>
    </div>
    <div class="mq"><div class="mq__track" data-h-mq1></div></div>
    <div class="mq"><div class="mq__track mq__track--rev" data-h-mq2></div></div>
    <div class="shell shell--wide">
      <div class="mq-foot" data-h-mqFoot></div>
    </div>
  </section>

  <!-- 9 · CLOSING BAND -->
  <section class="section">
    <div class="shell shell--wide">
      <div class="band rv">
        <span class="pill pill--on-dark" data-h-bandPill></span>
        <h2 data-h-bandH data-split></h2>
        <p data-h-bandP></p>
        <div style="display:flex;flex-direction:column;align-items:center;gap:.65rem;margin-top:1.75rem">
          <span class="mono" style="color:rgba(255,255,255,.55)" data-h-bandCd></span>
          <div data-countdown="2026-09-14" data-countdown-dark></div>
        </div>
        <a class="cta-round" href="courses.html" data-h-bandCta></a>
      </div>
    </div>
  </section>

  <!-- 10 · FAQ -->
  <section class="section" style="padding-top:0">
    <div class="shell" style="max-width:900px">
      <div class="head-c rv">
        <span class="pill" data-h-faqPill></span>
        <h2 data-h-faqH data-split></h2>
        <p data-h-faqP></p>
      </div>
      <div class="rv" data-h-faq></div>
    </div>
  </section>

</main>

<footer data-app-footer></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/seo.js"></script>
<script src="assets/js/cro.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
