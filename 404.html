<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Osolutions Academy</title>
<meta name="description" content="That page is not here. Head back to the course catalog.">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="OSO Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="assets/css/home.css">
<link rel="stylesheet" href="assets/css/fixes.css">
</head>
<body>

<header data-app-header></header>

<main class="hero2" style="min-height:calc(100vh - var(--nav-h))">
  <div class="hero2__bg"><div class="hero2__glow"></div><div class="hero2__grid"></div></div>
  <div class="shell" style="position:relative;z-index:2;text-align:center;max-width:660px">
    <span class="mono" style="color:var(--orange-400);font-size:4rem;font-weight:600;letter-spacing:.1em;display:block;margin-bottom:1rem">404</span>
    <h1 style="color:#fff;font-size:clamp(1.9rem,4.4vw,3rem)" data-nf-h></h1>
    <p style="color:rgba(255,255,255,.7);margin:1.1rem auto 2rem;max-width:48ch" data-nf-p></p>
    <div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap">
      <a class="cta-round" href="courses.html" data-nf-cta></a>
      <a class="cta-round cta-round--on-dark" href="index.html" data-nf-home></a>
    </div>
    <div style="margin-top:3rem" data-nf-courses></div>
  </div>
</main>

<footer data-app-footer></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/seo.js"></script>
<script src="assets/js/cro.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function (w, d) {
  'use strict';
  w.App.init(function () {
    var T = w.I18n, A = w.App, L = w.LMS;
    var arrow = '<span class="cta-round__ico">' + A.icon('arrow') + '</span>';
    d.querySelector('[data-nf-h]').textContent = T.t('nf.h');
    d.querySelector('[data-nf-p]').textContent = T.t('nf.p');
    d.querySelector('[data-nf-cta]').innerHTML = '<span>' + A.esc(T.t('nf.cta')) + '</span>' + arrow;
    d.querySelector('[data-nf-home]').innerHTML = '<span>' + A.esc(T.t('nav.home')) + '</span>' + arrow;
    d.querySelector('[data-nf-courses]').innerHTML =
      '<span class="mono" style="color:rgba(255,255,255,.45);display:block;margin-bottom:.9rem">' +
      A.esc(T.t('crs.related')) + '</span>' +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">' +
      L.COURSES.slice(0, 4).map(function (c) {
        return '<a class="pill pill--on-dark" href="course.html?id=' + c.id + '" style="text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:.8rem">' +
          A.esc(T.pick(c.title)) + '</a>';
      }).join('') + '</div>';
    d.body.classList.add('dark-head');
  });
})(window, document);
</script>
</body>
</html>
