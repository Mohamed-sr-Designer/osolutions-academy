<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Osolutions Academy</title>
<meta name="description" content="Sign in to the Osolutions Academy learning platform.">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="OSO Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/motion.css">
</head>
<body>

<header data-app-header></header>

<main class="auth">
  <div class="auth__box">
    <h1 style="font-size:clamp(1.7rem,3.4vw,2.3rem)" data-i18n="auth.title"></h1>
    <p style="margin-top:.7rem;font-size:.92rem" data-i18n="auth.sub"></p>

    <div class="role-pick" data-roles></div>

    <div class="card card--pad">
      <div style="display:grid;gap:.9rem">
        <div class="field"><label data-i18n="auth.email"></label><input class="input" type="email" value="mohamed.tarek@osolutions.academy"></div>
        <div class="field"><label data-i18n="auth.password"></label><input class="input" type="password" value="••••••••••"></div>
        <label class="check"><input type="checkbox" checked><span data-i18n="auth.remember"></span></label>
        <button class="btn btn--navy btn--block" data-signin data-i18n="nav.signin"></button>
      </div>
    </div>

    <p style="font-size:.76rem;color:var(--text-3);margin-top:1.1rem;text-align:center;line-height:1.55" data-i18n="auth.demoNote"></p>
  </div>
</main>

<footer data-app-footer></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/seo.js"></script>
<script src="assets/js/cro.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
